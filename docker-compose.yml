version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - .env

  ai:
    build: ./ai
    ports:
      - "5000:5000"

  database:
    image: postgres:16
    ports:
      - "5432:5432"
    env_file:
      - .env
