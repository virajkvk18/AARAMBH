<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Stylized Geo Outline of Maharashtra State -->
  <path d="M 175,140 
           C 200,130 230,120 270,125 
           C 310,130 350,110 390,95 
           C 430,80 480,85 530,90 
           C 570,95 620,105 660,120 
           C 700,135 730,160 760,195 
           C 780,220 785,255 765,290 
           C 745,320 710,340 680,365 
           C 650,390 625,420 590,440 
           C 555,460 520,480 485,505 
           C 450,530 420,555 390,580 
           C 365,600 340,615 315,620 
           C 290,625 270,600 255,570 
           C 240,540 230,500 220,460 
           C 210,420 200,380 185,340 
           C 170,300 155,260 145,220 
           C 140,195 145,165 175,140 Z" 
        stroke="currentColor" 
        stroke-dasharray="4 4"
        opacity="0.3" 
        fill="currentColor" 
        fill-opacity="0.03" />
  
  <!-- Internal Major Industrial Corridors & Nodes -->
  <!-- Mumbai-Thane-JNPT Node -->
  <circle cx="165" cy="285" r="4" fill="currentColor" opacity="0.6"/>
  <text x="175" y="288" font-size="10" font-family="sans-serif" font-weight="600" fill="currentColor" opacity="0.5">Mumbai-MMR</text>

  <!-- Pune-Chakan-Ranjangaon Node -->
  <circle cx="245" cy="360" r="4" fill="currentColor" opacity="0.6"/>
  <text x="255" y="363" font-size="10" font-family="sans-serif" font-weight="600" fill="currentColor" opacity="0.5">Pune-Chakan</text>

  <!-- Nashik-Sinnar Node -->
  <circle cx="230" cy="225" r="3.5" fill="currentColor" opacity="0.6"/>
  <text x="240" y="228" font-size="10" font-family="sans-serif" font-weight="600" fill="currentColor" opacity="0.5">Nashik-Sinnar</text>

  <!-- Chhatrapati Sambhajinagar - Waluj/AURIC Node -->
  <circle cx="345" cy="270" r="3.5" fill="currentColor" opacity="0.6"/>
  <text x="355" y="273" font-size="10" font-family="sans-serif" font-weight="600" fill="currentColor" opacity="0.5">AURIC-Shendra</text>

  <!-- Nagpur-Butibori Node -->
  <circle cx="670" cy="185" r="4" fill="currentColor" opacity="0.6"/>
  <text x="680" y="188" font-size="10" font-family="sans-serif" font-weight="600" fill="currentColor" opacity="0.5">Nagpur-MIHAN</text>

  <!-- Kolhapur-Kagal Node -->
  <circle cx="235" cy="515" r="3.5" fill="currentColor" opacity="0.6"/>
  <text x="245" y="518" font-size="10" font-family="sans-serif" font-weight="600" fill="currentColor" opacity="0.5">Kolhapur-Kagal</text>

  <!-- Connecting Industrial Expressways (Samruddhi Mahamarg & Golden Quadrilateral) -->
  <path d="M 165,285 Q 230,225 345,270 T 670,185" stroke="currentColor" stroke-width="1.2" opacity="0.25" stroke-dasharray="2 3"/>
  <path d="M 165,285 Q 200,320 245,360 T 235,515" stroke="currentColor" stroke-width="1.2" opacity="0.25" stroke-dasharray="2 3"/>
</svg>
